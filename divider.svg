<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="Divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="repeat">
      <stop offset="0.000" stop-color="#4285F4"/>
      <stop offset="0.167" stop-color="#A142F4"/>
      <stop offset="0.333" stop-color="#EA4335"/>
      <stop offset="0.500" stop-color="#FBBC05"/>
      <stop offset="0.667" stop-color="#34A853"/>
      <stop offset="0.833" stop-color="#24C1E0"/>
      <stop offset="1.000" stop-color="#4285F4"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="450 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="6" rx="3" fill="url(#flow)"/>
  <circle cy="7" r="6" fill="#F0F6FC"><animate attributeName="cx" values="0;900" dur="5s" repeatCount="indefinite"/></circle>
</svg>
